    <title>Flowerman Arrangement - Lyrics</title>
    <style>
        @font-face { font-family: 'en-font'; src: url('DeterminationSansWebRegular-369X.ttf'); }
        @font-face { font-family: 'ko-font'; src: url('DeltaDotumKR.ttf'); }
        @font-face { font-family: 'ja-font'; src: url('JF-Dot-Shinonome14.ttf'); }
        @font-face { font-family: 'zh-font'; src: url('russian.ttf'); }
        @font-face { font-family: 'es-font'; src: url('DeterminationSansWebRegular-369X.ttf'); }
        @font-face { font-family: 'ru-font'; src: url('russian.ttf'); }

        body {
            background-color: #000; 
            color: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
            image-rendering: pixelated;
            font-smooth: never;
            -webkit-font-smoothing: none;
        }

        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -10; 
            pointer-events: none;
            filter: brightness(0.35);
        }

        #ui {
            background: rgba(0, 0, 0, 0.85);
            padding: 15px 20px;
            display: flex;
            gap: 20px;
            align-items: center;
            z-index: 100;
            border-bottom: 2px solid #222;
        }

        button { background: #222; color: #fff; border: 1px solid #555; padding: 8px 15px; font-size: 16px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        button:hover { background: #444; }

        .time-controls { display: flex; align-items: center; gap: 10px; flex: 1; }
        #timeline { flex: 1; cursor: pointer; accent-color: #008000; }
        #time-display { font-family: monospace; font-size: 16px; min-width: 100px; text-align: right; }
        
        .sync-control { display: flex; align-items: center; gap: 5px; font-size: 14px; background: #111; padding: 5px 10px; border-radius: 4px; border: 1px solid #444; }
        .sync-control input { width: 50px; background: transparent; color: white; border: none; font-size: 14px; text-align: center; }

        .lang-toggles { display: flex; gap: 15px; font-size: 16px; flex-wrap: wrap; }
        .lang-toggles label { cursor: pointer; display: flex; align-items: center; gap: 5px; }

        #master {
            flex: 1;
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .layer {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transform-origin: center center;
        }

        .layer.main { z-index: 10; }
        .layer.ghost {
            mix-blend-mode: plus-lighter; 
            pointer-events: none;
            z-index: 20; 
        }

        .font-en { font-family: 'en-font'; }
        .font-ko { font-family: 'ko-font'; }
        .font-ja { font-family: 'ja-font'; }
        .font-zh { font-family: 'zh-font'; }
        .font-es { font-family: 'es-font'; }
        .font-ru { font-family: 'ru-font'; }

        .lang-row {
            display: flex;
            flex-wrap: nowrap;
            justify-content: center;
            align-items: center;
            font-size: 52px;
            margin-bottom: 25px;
        }

        .syl {
            position: relative;
            display: block;
            white-space: pre;
            line-height: 1.2;
        }

        .base {
            display: block;
            padding: 12px;
            margin: -12px;
            color: #ffff00;
            text-shadow: 
                -2px -2px 0 #000, 0 -2px 0 #000, 2px -2px 0 #000,
                -2px  0   0 #000,                2px  0   0 #000,
                -2px  2px 0 #000, 0  2px 0 #000, 2px  2px 0 #000;
        }

        .fill {
            position: absolute;
            left: 0;
            top: 0;
            display: block;
            padding: 12px;
            margin: -12px;
            color: var(--fill-col, #008000);
            text-shadow: 
                -2px -2px 0 #fff, 0 -2px 0 #fff, 2px -2px 0 #fff,
                -2px  0   0 #fff,                2px  0   0 #fff,
                -2px  2px 0 #fff, 0  2px 0 #fff, 2px  2px 0 #fff;
            clip-path: inset(0 calc(100% - var(--prog, 0%)) 0 0);
            pointer-events: none;
        }
    </style>
</head>

let globalIdx = 0;
for (let i = 0; i < lyricsData.length; i++) {
    let line = lyricsData[i];
    while (globalIdx < notetime.length && noteend[globalIdx] <= line.time + 0.05) {
        globalIdx++;
    }
    line.startNoteIdx = globalIdx;
}

function parseSyllables(text, lang, startNoteIdx) {
    let syllables = [];
    let currentIdx = startNoteIdx;
    let buffer = "";

    // 영어(en), 스페인어(es), 러시아어(ru)
    if (lang === 'en' || lang === 'es' || lang === 'ru') {
        for (let i = 0; i < text.length; i++) {
            let char = text[i];
            if (char === '-') {
                if (buffer.length > 0) {
                    syllables.push({ text: buffer, startIdx: currentIdx, endIdx: currentIdx });
                    currentIdx++; buffer = "";
                }
            } else if (char === ' ') {
                if (buffer.length > 0) {
                    buffer += " ";
                    syllables.push({ text: buffer, startIdx: currentIdx, endIdx: currentIdx });
                    currentIdx++; buffer = "";
                } else if (syllables.length > 0) {
                    syllables[syllables.length - 1].text += " ";
                }
            } else {
                buffer += char;
            }
        }
        if (buffer.length > 0) {
            syllables.push({ text: buffer, startIdx: currentIdx, endIdx: currentIdx });
        }
    } else { 
        // 한국어(ko), 일본어(ja), 중국어(zh)
        let inBracket = false;
        for (let i = 0; i < text.length; i++) {
            let char = text[i];
            if (char === '<' || char === '＜') {
                if (buffer.length > 0) {
                    syllables.push({ text: buffer, startIdx: currentIdx, endIdx: currentIdx });
                    currentIdx++; buffer = "";
                }
                inBracket = true;
            } else if (char === '>' || char === '＞') {
                inBracket = false;
                if (buffer.length > 0) {
                    syllables.push({ text: buffer, startIdx: currentIdx, endIdx: currentIdx });
                    currentIdx++; buffer = "";
                }
            } else if (char === '+' || char === '＋') {
                if (syllables.length > 0) syllables[syllables.length - 1].endIdx++;
                currentIdx++;
            } else if (char === ' ') {
                if (buffer.length > 0) {
                    buffer += " ";
                } else if (syllables.length > 0) {
                    syllables[syllables.length - 1].text += " ";
                }
            } else {
                buffer += char;
                if (!inBracket) {
                    syllables.push({ text: buffer, startIdx: currentIdx, endIdx: currentIdx });
                    currentIdx++; buffer = "";
                }
            }
        }
        if (buffer.length > 0) {
            syllables.push({ text: buffer, startIdx: currentIdx, endIdx: currentIdx });
        }
    }
    return syllables;
}

const audio = document.getElementById("bgm");
const master = document.getElementById("master");
const layerMain = document.getElementById("layer-main");
const layerGhosts = [
    document.getElementById("layer-ghost-0"), document.getElementById("layer-ghost-1"),
    document.getElementById("layer-ghost-2"), document.getElementById("layer-ghost-3"),
    document.getElementById("layer-ghost-4"), document.getElementById("layer-ghost-5"),
    document.getElementById("layer-ghost-6"), document.getElementById("layer-ghost-7")
];

const playBtn = document.getElementById("play-btn");
const timeline = document.getElementById("timeline");
const timeDisplay = document.getElementById("time-display");
const syncOffsetInput = document.getElementById("sync-offset");

// 추가된 언어를 langs 배열과 checkBoxes 객체에 등록
const langs = ['ko', 'en', 'ja', 'zh', 'es', 'ru'];
const checkBoxes = { 
    ko: document.getElementById("chk-ko"), 
    en: document.getElementById("chk-en"), 
    ja: document.getElementById("chk-ja"),
    zh: document.getElementById("chk-zh"),
    es: document.getElementById("chk-es"),
    ru: document.getElementById("chk-ru")
};

let currentLineIndex = -1;
let strength = 0;
let activeSyllables = [];
let contentDirty = false;

Object.values(checkBoxes).forEach(cb => {
    cb.addEventListener("change", () => { contentDirty = true; });
});

function formatTime(secs) {
    if (isNaN(secs)) return "0:00";
    let m = Math.floor(secs / 60);
    let s = Math.floor(secs % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
}

playBtn.addEventListener("click", () => {
    if (audio.paused) { 
        audio.play(); 
        playBtn.innerText = "⏸ Pause"; 
        document.getElementById("bg-video").play();
    } else { 
        audio.pause(); 
        playBtn.innerText = "▶ Play"; 
        document.getElementById("bg-video").pause();
    }
});

audio.addEventListener("loadedmetadata", () => {
    timeline.max = audio.duration;
    timeDisplay.innerText = `0:00 / ${formatTime(audio.duration)}`;
});

timeline.addEventListener("input", (e) => {
    audio.currentTime = e.target.value;
    timeDisplay.innerText = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
});

function loop() {
    requestAnimationFrame(loop);

    let syncOffset = parseFloat(syncOffsetInput.value) || 0;
    let trackpos = audio.currentTime + syncOffset;
    
    if (!audio.paused) {
        timeline.value = audio.currentTime;
        timeDisplay.innerText = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
    }

    if (trackpos >= 166 || (trackpos >= 46 && trackpos < 120)) {
        strength = Math.min(strength + 0.015, 1);
    } else {
        strength = Math.max(strength - 0.05, 0);
    }

    let lastBeat = -1;
    for (let b of beattime) {
        if (trackpos >= b) lastBeat = b;
        else break;
    }
    let beat = 0;
    if (lastBeat !== -1) {
        let timeSince = trackpos - lastBeat;
        let beatDur = 60 / 160;
        if (timeSince < beatDur) beat = 1 - (timeSince / beatDur);
    }

    master.style.opacity = 0.6 + (strength * 0.4);

    for (let i = 0; i < 8; i++) {
        let pow = (i + 1) / 8;
        let scale = 1 + (strength * pow) / 2 + (beat / 10);
        let opacity = Math.max(0, (0.2 * strength * (1 - pow)));
        
        layerGhosts[i].style.transform = `scale(${scale})`;
        layerGhosts[i].style.opacity = opacity;
    }

    let newIndex = 0;
    for (let i = 0; i < lyricsData.length; i++) {
        if (trackpos >= lyricsData[i].time) newIndex = i;
        else break;
    }

    if (newIndex !== currentLineIndex || contentDirty) {
        currentLineIndex = newIndex;
        contentDirty = false;
        activeSyllables = [];
        
        let htmlContent = "";
        langs.forEach(lang => {
            if (checkBoxes[lang].checked && lyricsData[currentLineIndex][lang]) {
                htmlContent += `<div class="lang-row font-${lang}">`;
                let syls = parseSyllables(lyricsData[currentLineIndex][lang], lang, lyricsData[currentLineIndex].startNoteIdx);
                
                syls.forEach((syl, index) => {
                    let id = `syl-${lang}-${index}`;
                    activeSyllables.push({ id: id, startT: notetime[syl.startIdx], endT: noteend[syl.endIdx] });
                    
                    htmlContent += `<div class="syl" style="--prog: var(--${id}, 0%)"><div class="base">${syl.text}</div><div class="fill">${syl.text}</div></div>`;
                });
                htmlContent += `</div>`;
            }
        });

        layerMain.innerHTML = htmlContent;
        layerGhosts.forEach(g => g.innerHTML = htmlContent);
    }

    let extraPow = 0;
    if (currentLineIndex === 18 || currentLineIndex === 37) {
        let glowstart = (currentLineIndex === 37) ? 191 : 71;
        extraPow = Math.max(Math.min(trackpos - glowstart, 1), 0);
    }
    let r = Math.round(255 * extraPow);
    let gColor = Math.round(128 + (127 * extraPow));
    let b = Math.round(255 * extraPow);
    master.style.setProperty('--fill-col', `rgb(${r}, ${gColor}, ${b})`);

    activeSyllables.forEach(s => {
        let p = 0;
        if (trackpos >= s.endT) p = 100;
        else if (trackpos > s.startT) p = ((trackpos - s.startT) / (s.endT - s.startT)) * 100;
        master.style.setProperty(`--${s.id}`, `${p}%`);
    });
}

requestAnimationFrame(loop);
</script>
