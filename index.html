<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hub</title>
<style>
@import url('https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css');

@font-face {
    font-family: 'Galmuri11';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2506-1@1.0/Galmuri11-Bold.woff2') format('woff2');
    font-weight: 700;
    font-display: swap;
}

body {
    background-color: #000000;
    color: #ffffff;
    font-family: 'Galmuri11', sans-serif;
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

.header {
    display: flex;
    justify-content: flex-end;
    padding: 20px;
    box-sizing: border-box;
}

#lang-selector {
    background-color: #000000;
    color: #ffffff;
    border: 1px solid #ffffff;
    padding: 8px 12px;
    font-family: 'Galmuri11', sans-serif;
    font-size: 14px;
    outline: none;
    cursor: pointer;
}

.container {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
    box-sizing: border-box;
}

h1 {
    font-size: 24px;
    margin-top: 0;
    margin-bottom: 40px;
    font-weight: 700;
}

ul {
    list-style: none;
    padding: 0;
    margin: 0;
    width: 100%;
    max-width: 400px;
}

li {
    margin: 15px 0;
}

a {
    color: #ffffff;
    text-decoration: none;
    font-size: 18px;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px;
    transition: opacity 0.3s ease;
}

a:hover {
    opacity: 0.5;
}

.link-title {
    display: inline-block;
    width: 170px;
    text-align: left;
    margin-right: 20px;
}

.link-arrow {
    display: inline-block;
    width: 90px;
    text-align: left;
}

.footer {
    padding: 20px;
    text-align: center;
    font-size: 12px;
    color: #888888;
    box-sizing: border-box;
}

.footer a {
    color: #888888;
    font-size: 12px;
    text-decoration: underline;
    transition: color 0.3s ease;
}

.footer a:hover {
    color: #ffffff;
}

@media (max-width: 480px) {
    h1 {
        font-size: 20px;
        line-height: 1.4;
    }
    a {
        font-size: 16px;
    }
    .link-title {
        width: 55%;
        margin-right: 10px;
    }
    .link-arrow {
        width: 35%;
    }
}
</style>
</head>
<body>

<div class="header">
    <select id="lang-selector">
        <option value="ko">한국어</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
    </select>
</div>

<div class="container">
    <h1 id="main-title">언더테일/델타룬 다국어 비교기</h1>
    <ul>
        <li>
            <a href="deltarune/">
                <span class="link-title" data-i18n="deltarune">Deltarune</span>
                <span class="link-arrow" data-i18n="go">이동 -></span>
            </a>
        </li>
        <li>
            <a href="undertale/">
                <span class="link-title" data-i18n="undertale">Undertale</span>
                <span class="link-arrow" data-i18n="go">이동 -></span>
            </a>
        </li>
        <li>
            <a href="undertaley/">
                <span class="link-title" data-i18n="undertaleyellow">Undertale Yellow</span>
                <span class="link-arrow" data-i18n="go">이동 -></span>
            </a>
        </li>
        <li>
            <a href="flowerman/">
                <span class="link-title" data-i18n="flowerman">Flowerman</span>
                <span class="link-arrow" data-i18n="go">이동 -></span>
            </a>
        </li>
    </ul>
</div>

<div class="footer">
    <span data-i18n="author">만든이:</span>
    <a href="https://github.com/newhajinyoon/deltarune-multilingual-text-dump" target="_blank" data-i18n="name">진윤</a>
</div>

<script>
const translations = {
    ko: {
        title: "언더테일/델타룬 다국어 비교기",
        deltarune: "델타룬",
        undertale: "언더테일",
        undertaleyellow: "언더테일 옐로우",
        flowerman: "플라워맨",
        go: "이동 ->",
        author: "만든이: ",
        name: "진윤"
    },
    en: {
        title: "Undertale/Deltarune Multilingual Text Dump",
        deltarune: "Deltarune",
        undertale: "Undertale",
        undertaleyellow: "Undertale Yellow",
        flowerman: "Flowerman",
        go: "Go ->",
        author: "Created by: ",
        name: "jinyoon"
    },
    ja: {
        title: "Undertale/Deltarune 多言語テキスト比較",
        deltarune: "Deltarune",
        undertale: "Undertale",
        undertaleyellow: "Undertale Yellow",
        flowerman: "Flowerman",
        go: "移動 ->",
        author: "作成者: ",
        name: "ジンユン"
    }
};

function updateLanguage(lang) {
    if (!translations[lang]) lang = 'en';
    
    document.getElementById('main-title').textContent = translations[lang].title;
    
    const elements = document.querySelectorAll('[data-i18n]');
    elements.forEach(el => {
        const key = el.getAttribute('data-i18n');
        if(translations[lang][key]) {
            el.textContent = translations[lang][key];
        }
    });

    document.documentElement.lang = lang;
}

const sysLang = navigator.language.slice(0, 2);
const defaultLang = translations[sysLang] ? sysLang : 'en';

const langSelector = document.getElementById('lang-selector');
langSelector.value = defaultLang;

updateLanguage(defaultLang);

langSelector.addEventListener('change', function(e) {
    updateLanguage(e.target.value);
});
</script>
</body>
</html>
